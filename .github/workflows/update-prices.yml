name: Update prices

on:
  schedule:
    - cron: "17 11 * * *" # Every day at about 11:17 UTC. GitHub may start a little late.
  workflow_dispatch:
    inputs:
      approve:
        description: Held product IDs to accept, separated by commas. Leave blank for a normal price check.
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: update-prices

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 scripts/test_update_prices.py

      - name: Accept reviewed prices
        if: ${{ inputs.approve != '' }}
        env:
          APPROVE: ${{ inputs.approve }}
        run: python3 scripts/update_prices.py --approve "$APPROVE"

      - name: Check store prices
        if: ${{ inputs.approve == '' }}
        run: python3 scripts/update_prices.py

      - name: Save the results
        run: |
          git add prices.json scripts/prices-review.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update prices"
          git push

      - name: Update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_prices.py --review > review.md
          held_ids() { grep -o '^- `[^`]*`' | sort; }
          new_ids=$(held_ids < review.md || true)
          number=$(gh issue list --state open --search 'in:title "Prices to review"' --json number --jq '.[0].number // empty')
          if [ -n "$new_ids" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "Prices to review" --body-file review.md
            else
              old_ids=$(gh issue view "$number" --json body --jq .body | held_ids || true)
              gh issue edit "$number" --body-file review.md
              if [ "$old_ids" != "$new_ids" ]; then
                gh issue comment "$number" --body "The list of prices to review has changed."
              fi
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing is left to review."
          fi
